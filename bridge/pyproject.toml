[project]
name = "hermes-alexa-bridge"
version = "0.1.0"
description = "Sidecar that talks to Amazon Alexa for the hermes-alexa plugin"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    # Pinned: the bridge relies on how this exact version batches commands
    # (see amazon.AlexaAccount._send and tests/test_library_contract.py).
    "aioamazondevices==17.2.11",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_alexa_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
