name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: plugin (Hermes ${{ matrix.hermes }}, Python 3.14)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        hermes: [v0.23.1]  # the version this plugin is tested against
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
      - name: install Hermes from its lock file
        working-directory: hermes-agent
        run: |
          uv sync --frozen --python 3.14
          uv pip install --python .venv "aiohttp==3.14.5" "pytest==9.1.1"
      - name: tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
          PYTHONUTF8: "1"
        run: ../hermes-agent/.venv/bin/python -m pytest -q
      - name: hermes plugins validate
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes-agent/.venv/bin/hermes plugins validate plugin

  bridge:
    name: bridge (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . "pytest==9.1.1" "pytest-aiohttp>=1.1"
      - run: python -m pytest -q
